name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Sync (CPU torch only — the CUDA wheel must never download here)
        run: uv sync --frozen --extra cpu --extra raw

      - name: Ruff
        run: uv run --frozen --extra cpu --extra raw ruff check .

      - name: Mypy
        run: uv run --frozen --extra cpu --extra raw mypy engine/src server/src

      - name: Pytest (CPU device)
        env:
          PLANEFUSE_DEVICE: cpu
        run: uv run --frozen --extra cpu --extra raw pytest -q

      - name: Python dependency audit
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install, audit, typecheck, and build
        working-directory: ui
        run: |
          npm ci --no-fund --fetch-retries=5 --fetch-retry-maxtimeout=120000
          npm audit --audit-level=high
          npm run check
          npm run build

      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Browser workflow (CPU)
        working-directory: ui
        run: npm run test:e2e

      - name: Documentation contract
        run: uv run --frozen --extra cpu --extra raw python scripts/check_docs.py

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build CPU image
        run: docker build --target cpu -t planefuse:cpu .

      - name: Validate CUDA Compose security/configuration
        run: docker compose config --quiet

      - name: Run and health-check /api/system
        run: |
          docker run -d --name fs -p 127.0.0.1:8425:8425 planefuse:cpu
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8425/api/system >/dev/null; then
              echo "healthy"; docker rm -f fs; exit 0
            fi
            sleep 2
          done
          echo "server never became healthy"; docker logs fs; docker rm -f fs; exit 1
