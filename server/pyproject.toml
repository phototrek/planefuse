[project]
name = "planefuse-server"
version = "0.1.0"
description = "PlaneFuse local server + web UI host"
requires-python = ">=3.12"
dependencies = [
  "planefuse",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "platformdirs>=4.0",
  "pillow>=12.3",
]

[project.scripts]
planefuse-server = "planefuse_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planefuse_server"]
