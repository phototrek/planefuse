[project]
name = "focusstack-server"
version = "0.1.0"
description = "FocusStack local server + web UI host"
requires-python = ">=3.12"
dependencies = [
  "focusstack",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "platformdirs>=4.0",
]

[project.scripts]
focusstack-server = "focusstack_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focusstack_server"]
